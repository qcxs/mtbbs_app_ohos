name: mtbbs
description: "MTBBS - A Flutter client for Discuz forums (bbs.binmt.cc)"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Material/Cupertino 内置文案的中文本地化（文本选择菜单、日期选择器、
  # 语义标签等）。未配置时 MaterialLocalizations 回落到 DefaultMaterialLocalizations
  # ——它只有英文，且与系统语言无关。
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^2.0.0

  # 网络
  dio: ^5.11.1
  dio_cookie_manager: ^3.5.0
  cookie_jar: ^4.0.0
  path_provider: ^2.1.0

  # 存储
  sembast: ^3.10.0
  path: ^1.9.0

  # 路由
  go_router: ^18.1.3

  # 鸿蒙应用接续（应用流转）的 Dart 插件：声明 dartPluginClass 后由 flutter_tools
  # 自动写进 dart_plugin_registrant，引擎在 isolate 启动时注册 —— 构建/运行不再
  # 需要 --target lib/ohos/entry.dart（见 docs/ohos/05 §5.1）。
  # 包内自包含（不反向依赖 app），避免 pub 循环依赖。
  mtbbs_ohos_bridge:
    path: packages/mtbbs_ohos_bridge

  # file_picker 13.x 没有 ohos 平台实现；OH 社区 fork 最新分支只到 10.x
  # （且已改名为 file_picker_ohos，API 仍是旧版）。这里用一个 Dart 插件把
  # 新 API 的 FilePickerPlatform 适配到旧 fork（见 packages/file_picker_ohos_bridge）。
  file_picker_ohos_bridge:
    path: packages/file_picker_ohos_bridge

  # 状态管理
  provider: ^6.1.0

  # 桌面窗口管理（Windows/macOS/Linux）
  window_manager: ^0.5.2

  # 配色方案
  flex_seed_scheme: ^4.0.1

  # 图片缓存
  cached_network_image: ^4.0.3
  flutter_cache_manager: ^3.5.0
  http: ^1.2.0

  # HTML 解析
  html: ^0.15.7
  xml: ^7.0.1

  # Markdown 解析（编辑器「导入 Markdown」→ BBCode，见 lib/core/parser/md2bbcode.dart）
  markdown: ^7.3.1

  # 数学公式渲染（52pojie Markdown 帖的 LaTeX → Widget，KaTeX 的 Dart 移植）
  flutter_math_fork: ^0.7.4

  # 瀑布流布局
  flutter_staggered_grid_view: ^0.7.0

  # WebView（跨平台：Android/iOS/macOS/Windows/Linux/Web）
  flutter_inappwebview: ^6.1.5
  file_picker: ^13.3.2
  url_launcher: ^6.3.3
  photo_view: ^0.15.0

  # 保存「生成图片」分享卡到相册（Android/iOS 相册，Windows 图片库）。
  # 自带权限处理（Gal.hasAccess/requestAccess），无需 permission_handler/device_info_plus，
  # 使用见 lib/services/image_export.dart。
  gal: ^2.3.3

  # 长图分享：超长楼层按块截图后在 CPU 侧拼接并编码 PNG（纯 Dart，
  # 绕开单张 GPU 纹理上限），见 lib/services/image_export.dart。
  image: ^4.5.4

  # 分享图右下角二维码：用 qr 编码 + 自绘模块。
  # 不用 pretty_qr_code —— 它断言「单模块 ≥ 2px」，64px 的二维码会直接崩（见 docs/07 #91）。
  qr: ^4.0.0

  # 内嵌 JS 引擎（QuickJS）：在本地执行站点的人机验证挑战脚本，
  # 免去弹 WebView 打断用户（见 lib/core/app/js_challenge_solver.dart）。
  # 全平台同一 QuickJS（无 Apple JSC 分叉），须显式调小栈上限，并给不可信脚本设超时/内存上限。
  flutter_qjs_next: ^1.5.2

  # 哈希（编解码工具页的 MD5/SHA-1/SHA-256，见 lib/core/utils/codec_utils.dart）
  crypto: ^3.0.8

  # HTML 渲染（BBCode → HTML → Widget）
  # 代码语法高亮
  highlight: ^0.7.0
  flutter_highlight: ^0.7.0
  re_highlight: ^0.0.3
  charset: ^2.0.1
  flutter_widget_from_html_core: ^0.17.4

  # MCP 服务端（只读，本机 Streamable HTTP，双 era 兼容 2026-07-28 / 2025-11-25）
  # 锁到具体版本：协议与安全默认值随版本变化，升级前先读 docs/09。
  # 2.4.3 仅文档/示例修正，但国内镜像尚未同步归档（404），暂留 2.4.2。
  mcp_dart: 2.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# ---------------------------------------------------------------------------
# 鸿蒙（OpenHarmony）依赖覆盖 —— 本仓库自带的依赖配置，独立于上游
#
# 为什么放在 pubspec.yaml 而不是 pubspec_overrides.yaml：
#   本仓库是**独立的鸿蒙项目**，只有它自己的依赖；overrides 文件会让"哪些是自有配置"
#   变得含糊，且合并上游时容易出现"该留还是该删"的歧义。写进 pubspec.yaml 后，
#   合并规则就一条：**本段整块保留，其余按上游**（见 docs/ohos/03-同步上游.md）。
#
# 为什么需要覆盖：
#   pub.dev 上的这些插件没有 ohos 平台实现，在鸿蒙上调用会抛 MissingPluginException
#   （path_provider 更是启动即崩）。这里换成 OpenHarmony 社区维护的适配分支。
#
# 注意：这些 fork 硬编码了 `TargetPlatform.ohos`（官方 Flutter 没有该枚举），
#   所以本仓库**不能**用官方 Flutter 构建 Android/Windows；这是有意的取舍。
#   fork 保留上游全部平台实现，仅本仓库受影响。
#
# 版本差异（上游版本 -> OH fork 版本）：
#   path_provider         2.1.6 -> 2.1.5（降 1 个小版本）
#   url_launcher          6.3.3 -> 6.3.2（降 1 个小版本，OH 侧无 6.3.3 分支）
#   flutter_inappwebview  6.1.5 -> 6.1.5（无变化）
#   file_picker           13.3.2 无 OH 分支，改由 packages/file_picker_ohos_bridge
#                         适配 10.3.8（见 dependencies 里的 bridge 说明）
#
# 上游的 `flutter_inappwebview_windows` path 覆盖（third_party/…）不适用于本仓库：
#   本仓库没有 Windows 平台工程，也不镜像 third_party/。
#
# 维护：上游升级上述插件后，先确认 OH fork 是否有对应分支，再更新这里的 ref。
# ---------------------------------------------------------------------------
dependency_overrides:
  path_provider:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages.git
      path: packages/path_provider/path_provider
      ref: br_path_provider-v2.1.5_ohos

  url_launcher:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages.git
      path: packages/url_launcher/url_launcher
      ref: br_url_launcher-v6.3.2_ohos

  # 登录页 / 内置浏览器；版本与上游锁定版本一致
  # 已知缺陷：InAppWebViewKeepAlive 在鸿蒙上未实现（页面弹出后原生 WebView 销毁）
  flutter_inappwebview:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_inappwebview.git
      path: flutter_inappwebview
      ref: br_v6.1.5_ohos

  # 数学公式渲染（52pojie Markdown 帖 LaTeX）。上游 0.7.4 的 selectable/
  # line_editable 对 TargetPlatform 做了穷举 switch，OH SDK 多出 ohos 枚举后
  # 直接编译失败；改用 CPF-Flutter 的 OH 适配分支（版本同为 0.7.4）。
  flutter_math_fork:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_math_fork.git
      ref: br_v0.7.4_flutter3.35.7_ohos

  # Flutter 3.44 起 Material/Cupertino 被拆成独立的 material_ui / cupertino_ui 包，
  # go_router 18 与 cached_network_image 4 都依赖它们。这两个库内部对 TargetPlatform
  # 做穷举 switch，OH SDK 多出的 ohos 枚举会让 kernel 编译直接失败：
  #   The type 'TargetPlatform' is not exhaustively matched ... doesn't match 'TargetPlatform.ohos'
  # 上游暂未升级到可兼容的版本，OH 仓库回退到升级前已验证可编译的版本（上游仍用新版）。
  # 回退条件：material_ui/cupertino_ui 支持 ohos 枚举，或 OH SDK 改为非穷举实现。
  go_router: 14.8.1
  cached_network_image: 3.4.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    # 默认配置按域拆分：站点 / 工具栏 / 全局快捷键 / 缓存策略
    - assets/config/sites.json
    - assets/config/toolbar.json
    - assets/config/shortcuts.json
    - assets/config/cache.json
    - assets/config/quick_replies.json
    - assets/config/site_defaults.json
    - assets/config/thanks.json
    # 关于页展示的应用图标，由 mipmap-xxxhdpi/ic_launcher.png 复制而来
    - assets/icon/app_icon.png

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
