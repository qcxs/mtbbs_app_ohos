name: mtbbs
description: "MTBBS - A Flutter client for Discuz forums (bbs.binmt.cc)"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Material/Cupertino 内置文案的中文本地化（文本选择菜单、日期选择器、
  # 语义标签等）。未配置时 MaterialLocalizations 回落到 DefaultMaterialLocalizations
  # ——它只有英文，且与系统语言无关。
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 网络
  dio: ^5.4.0
  dio_cookie_manager: ^3.1.0
  cookie_jar: ^4.0.0
  path_provider: ^2.1.0

  # 存储
  sembast: ^3.8.9
  path: ^1.9.0

  # 路由
  go_router: ^14.0.0

  # 状态管理
  provider: ^6.1.0

  # 桌面窗口管理（Windows/macOS/Linux）
  window_manager: ^0.5.2

  # 配色方案
  flex_seed_scheme: ^4.0.1

  # 图片缓存
  cached_network_image: ^3.3.0
  flutter_cache_manager: ^3.3.0
  http: ^1.2.0

  # HTML 解析
  html: ^0.15.4
  xml: ^6.5.0

  # Markdown 解析（编辑器「导入 Markdown」→ BBCode，见 lib/core/parser/md2bbcode.dart）
  markdown: ^7.3.1

  # 瀑布流布局
  flutter_staggered_grid_view: ^0.7.0

  # WebView（跨平台：Android/iOS/macOS/Windows/Linux/Web）
  flutter_inappwebview: ^6.1.5
  file_picker: ^8.0.0
  url_launcher: ^6.3.2
  photo_view: ^0.15.0

  # 保存「生成图片」分享卡到相册（Android/iOS 相册，Windows 图片库）。
  # 自带权限处理（Gal.hasAccess/requestAccess），无需 permission_handler/device_info_plus，
  # 使用见 lib/services/image_export.dart。
  gal: ^2.3.3

  # 长图分享：超长楼层按块截图后在 CPU 侧拼接并编码 PNG（纯 Dart，
  # 绕开单张 GPU 纹理上限），见 lib/services/image_export.dart。
  image: ^4.5.4

  # 分享图右下角二维码：用 qr 编码 + 自绘模块。
  # 不用 pretty_qr_code —— 它断言「单模块 ≥ 2px」，64px 的二维码会直接崩（见 docs/07 #91）。
  qr: ^3.0.2

  # 内嵌 JS 引擎（QuickJS）：在本地执行站点的人机验证挑战脚本，
  # 免去弹 WebView 打断用户（见 lib/core/app/js_challenge_solver.dart）。
  # 全平台同一 QuickJS（无 Apple JSC 分叉），须显式调小栈上限，并给不可信脚本设超时/内存上限。
  flutter_qjs_next: ^1.5.2

  # HTML 渲染（BBCode → HTML → Widget）
  # 代码语法高亮
  highlight: ^0.7.0
  flutter_highlight: ^0.7.0
  re_highlight: ^0.0.3
  charset: ^2.0.1
  flutter_widget_from_html_core: ^0.17.4

  # MCP 服务端（只读，本机 Streamable HTTP，双 era 兼容 2026-07-28 / 2025-11-25）
  # 锁到具体版本：协议与安全默认值随版本变化，升级前先读 docs/09
  mcp_dart: 2.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# ---------------------------------------------------------------------------
# 鸿蒙（OpenHarmony）依赖覆盖 —— 本仓库自带的依赖配置，独立于上游
#
# 为什么放在 pubspec.yaml 而不是 pubspec_overrides.yaml：
#   本仓库是**独立的鸿蒙项目**，只有它自己的依赖；overrides 文件会让"哪些是自有配置"
#   变得含糊，且合并上游时容易出现"该留还是该删"的歧义。写进 pubspec.yaml 后，
#   合并规则就一条：**本段整块保留，其余按上游**（见 docs/ohos/03-同步上游.md）。
#
# 为什么需要覆盖：
#   pub.dev 上的这些插件没有 ohos 平台实现，在鸿蒙上调用会抛 MissingPluginException
#   （path_provider 更是启动即崩）。这里换成 OpenHarmony 社区维护的适配分支。
#
# 注意：这些 fork 硬编码了 `TargetPlatform.ohos`（官方 Flutter 没有该枚举），
#   所以本仓库**不能**用官方 Flutter 构建 Android/Windows；这是有意的取舍。
#   fork 保留上游全部平台实现，仅本仓库受影响。
#
# 版本差异（上游版本 -> OH fork 版本）：
#   path_provider         2.1.6 -> 2.1.5（降 1 个小版本）
#   url_launcher          6.3.2 -> 6.3.2（无变化）
#   flutter_inappwebview  6.1.5 -> 6.1.5（无变化）
#   file_picker           8.3.7 -> 8.0.7（降 3 个小版本，OH 侧无 8.3.7 分支）
#
# 维护：上游升级上述插件后，先确认 OH fork 是否有对应分支，再更新这里的 ref。
# ---------------------------------------------------------------------------
dependency_overrides:
  path_provider:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages.git
      path: packages/path_provider/path_provider
      ref: br_path_provider-v2.1.5_ohos

  url_launcher:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages.git
      path: packages/url_launcher/url_launcher
      ref: br_url_launcher-v6.3.2_ohos

  # 登录页 / 内置浏览器；版本与上游锁定版本一致
  # 已知缺陷：InAppWebViewKeepAlive 在鸿蒙上未实现（页面弹出后原生 WebView 销毁）
  flutter_inappwebview:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_inappwebview.git
      path: flutter_inappwebview
      ref: br_v6.1.5_ohos

  # 编辑器选图 / 附件 / 图床上传；包位于仓库根目录，故不写 path
  file_picker:
    git:
      url: https://gitcode.com/openharmony-sig/fluttertpc_file_picker.git
      ref: br_v8.0.7_ohos

  # 解决 file_picker 8.0.7 与 flutter_inappwebview_web 的版本冲突：
  #   file_picker 8.0.7 要求 web ^0.5.1，而上游 8.3.7 与 inappwebview_web 都要求 web ^1.x。
  #   这里对齐项目原本就已锁定的 web 1.1.x —— web 包只服务 Web 平台，
  #   不影响鸿蒙构建；file_picker 的 web 实现也不会被编译。
  #   根治办法：给 fork 提 PR 把 web 约束改为 ^1.1.0。
  web: ^1.1.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    # 默认配置按域拆分：站点 / 工具栏 / 全局快捷键 / 缓存策略
    - assets/config/sites.json
    - assets/config/toolbar.json
    - assets/config/shortcuts.json
    - assets/config/cache.json
    - assets/config/quick_replies.json
    - assets/config/thanks.json
    # 关于页展示的应用图标，由 mipmap-xxxhdpi/ic_launcher.png 复制而来
    - assets/icon/app_icon.png

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
