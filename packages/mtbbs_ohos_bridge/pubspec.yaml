name: mtbbs_ohos_bridge
description: "MTBBS 鸿蒙应用接续（应用流转）的 Dart 侧实现（Dart 插件，随 App 自动注册）"
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # 接续需要在路由变化时切换系统侧可接续态、恢复时跳转页面。
  # 本包不依赖 app：GoRouter 从元素树上查找，避免 app <-> 插件的循环依赖。
  go_router: ^14.0.0

# 声明为 Dart 插件：flutter_tools 会把它写进
# `.dart_tool/flutter_build/dart_plugin_registrant.dart`，引擎在 isolate 启动时
# 自动调用 `MtbbsOhosBridge.registerWith()` —— 无需再传 `--target`。
flutter:
  plugin:
    platforms:
      ohos:
        dartPluginClass: MtbbsOhosBridge
