name: file_picker_ohos
description: A package that allows you to use a native file explorer to pick single or multiple absolute file paths, with extension filtering support.
homepage: https://github.com/miguelpruivo/plugins_flutter_file_picker
repository: https://gitcode.com/CPF-Flutter/fluttertpc_file_picker
issue_tracker: https://github.com/miguelpruivo/flutter_file_picker/issues
version: 10.3.8

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  flutter_plugin_android_lifecycle: ^2.0.22
  plugin_platform_interface: ^2.1.8
  ffi: ^2.1.3
  path: ^1.9.0
  win32: '>=5.9.0 <7.0.0'
  # 10.x 已无线下代码引用 image_picker（仅历史 CHANGELOG 提及）。
  # 去掉它可缩小依赖面，并规避国内镜像缺少 image_picker_ios 元数据导致的解析失败。
  cross_file: ^0.3.3+4
  web: ^1.1.0
  dbus: ^0.7.11

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

flutter:
  plugin:
    platforms:
      android:
        package: com.mr.flutter.plugin.filepicker
        pluginClass: FilePickerPlugin
        dartPluginClass: FilePickerIO
      ios:
        pluginClass: FilePickerPlugin
        dartPluginClass: FilePickerIO
      web:
        pluginClass: FilePickerWeb
        fileName: _internal/file_picker_web.dart
      # 桌面平台（macOS/Linux/Windows）实现已从本仓库的 lib 中移除（见
      # lib/src/file_picker.dart 的 _setPlatform）。保留这些 platform 条目会让
      # 生成的 dart_plugin_registrant 引用不存在的 FilePickerMacOS/Linux/Windows，
      # kernel 编译直接报 Undefined name。
      ohos:
        package: com.file_picker
        pluginClass: FilePickerPlugin
